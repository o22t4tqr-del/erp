# H5ERP PC 端 —— 一键起环境（应用 + MySQL 8）
# 用法：docker compose up -d
# 访问：http://localhost:8080   账号 admin / admin888

services:
  db:
    image: mysql:8.0
    container_name: h5erp-db
    command:
      # 老代码的 GROUP BY 写法不符合 ONLY_FULL_GROUP_BY，必须关掉
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_DATABASE:-erp}
    volumes:
      - db-data:/var/lib/mysql
      # 首次启动自动导入表结构
      - ./erp.sql:/docker-entrypoint-initdb.d/01-erp.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    container_name: h5erp-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      DB_DATABASE: ${DB_DATABASE:-erp}
      TZ: Asia/Shanghai
    volumes:
      # 上传的图片、附件
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  app-data:
